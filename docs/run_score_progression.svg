<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 758" role="img" aria-label="Run score progression charts">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
  .muted { fill: #52606d; }
  .grid { stroke: #edf1f5; }
  .axis { stroke: #9aa5b1; }
  .line { fill: none; stroke: #2563eb; stroke-width: 2.5; }
  .point { fill: #1d4ed8; }
  .panel { fill: #ffffff; stroke: #d8dee9; }
</style>
<rect width="920" height="758" fill="#ffffff"/>
<text x="24" y="28" font-size="20" font-weight="700">Run Score Progression</text>
<g transform="translate(0 32)">
<rect class="panel" x="8" y="0" width="904" height="320"/>
<text x="24" y="28" font-size="16" font-weight="700">New best scores</text>
<text class="muted" x="24" y="72" font-size="13">No scored runs yet.</text>
</g>
<g transform="translate(0 406)">
<rect class="panel" x="8" y="0" width="904" height="320"/>
<text x="24" y="28" font-size="16" font-weight="700">All scored runs</text>
<text class="muted" x="24" y="72" font-size="13">No scored runs yet.</text>
</g>
</svg>
