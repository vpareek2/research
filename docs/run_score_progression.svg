<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 758" role="img" aria-label="Run score progression charts">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
