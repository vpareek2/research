  .axis { stroke: #9aa5b1; }
  .line { fill: none; stroke: #2563eb; stroke-width: 2.5; }
  .point { fill: #1d4ed8; }
  .panel { fill: #ffffff; stroke: #d8dee9; }
</style>
<rect width="920" height="758" fill="#ffffff"/>
<text x="24" y="28" font-size="20" font-weight="700">Run Score Progression</text>
