<text x="24" y="28" font-size="16" font-weight="700">New best scores</text>
<line class="grid" x1="60" y1="272.0" x2="896" y2="272.0"/>
<text class="muted" x="52" y="276.0" text-anchor="end" font-size="12">24.99</text>
