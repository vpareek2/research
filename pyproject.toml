[project]
name = "research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.7",
    "grain>=0.2.16",
    "jax[cuda13]>=0.10.0",
    "optax>=0.2.8",
    "tiktoken>=0.12.0",
]

[project.scripts]
pretrain = "pretrain:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "data", "model", "pretrain"]
