[project]
name = "research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.91",
    "datasets>=4.8.4",
    "flax>=0.12.7",
    "grain>=0.2.16",
    "jax[cuda13]>=0.10.0",
    "jinja2>=3.1.6",
    "ninja>=1.13.0",
    "nvidia-ml-py>=13.595.45",
    "nvtx>=0.2.15",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.36",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
]

[project.scripts]
pretrain = "research.pretrain:main"
experiment = "research.utils.experiment:main"
eval-checkpoint = "research.utils.eval_checkpoint:main"
eval-core = "research.utils.core_eval:main"
summarize-run = "research.utils.run_summary:main"
register-run = "research.utils.run_registry:main"
list-runs = "research.utils.run_registry:list_main"
prepare-data = "research.prepare_data:main"
inspect-batch = "research.utils.inspect_batch:main"
param-count = "research.utils.param_count:main"
profile = "research.utils.profile_run:main"
train-budget = "research.utils.train_budget:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
