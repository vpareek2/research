[experiment]
name = "0_baseline"
out_dir = "runs"

[model]
vocab_size = 50257
hidden_size = 640
intermediate_size = 1792
n_layers = 12
n_heads = 10
n_kv_heads = 2
seq_len = 2048
theta = 1000000.0
eps = 0.000001
tied = false

[precision]
compute_dtype = "bf16"
param_dtype = "fp32"
loss_dtype = "fp32"

[distributed]
enabled = true
device_count = "auto"
axis_name = "data"

[profiling]
enabled = false
profiler = "none"
start_step = 100
steps = 5
output_dir = "profiles"

[target]
tokens = 2000000000

[train]
seed = 0
batch_size = 32
seq_len = 2048
steps = 30518
lr = 0.001
decay = 0.1
log_every = 10
eval_every = 250
eval_steps = 10
checkpoint_every = 500
keep_last = 4

[train.lr_schedule]
type = "cosine"
warmup_ratio = 0.01
min_lr_ratio = 0.1

[data]
source = "tokens"
path = "data/fineweb_sample10bt_gpt2"
tokenizer = "gpt2"
prepare_config = "configs/data/fineweb_sample10bt.toml"

[eval]
domain_eval_steps = 1
prepare_config = "configs/data/eval_domains.toml"

[sampling]
enabled = true
prompt = "Once upon a time"
max_new_tokens = 128
temperature = 0.8
top_k = 50

[wandb]
enabled = true
project = "data-research"
entity = ""
tags = ["first-run", "117m", "fineweb", "2b"]
