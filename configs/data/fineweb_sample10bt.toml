[source]
type = "hf"
dataset = "HuggingFaceFW/fineweb"
subset = "sample-10BT"
split = "train"
text_column = "text"
streaming = true

[hf]
prompt_for_token = true
token_env = "HF_TOKEN"

[tokenizer]
name = "gpt2"
append_eot = true

[output]
path = "data/fineweb_sample10bt_gpt2"
dtype = "uint32"
val_fraction = 0.001
