[source]
type = "hf"
dataset = "roneneldan/TinyStories"
split = "train"
text_column = "text"

[hf]
prompt_for_token = true
token_env = "HF_TOKEN"

[tokenizer]
name = "gpt2"
append_eot = true

[output]
path = "data/tinystories_gpt2"
dtype = "uint32"
val_fraction = 0.001
max_tokens = 100000000
shard_tokens = 128000000

[tokenization]
workers = "auto"
batch_docs = 256
queue_batches = 8
