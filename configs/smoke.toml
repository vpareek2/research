[experiment]
name = "tiny_shakespeare_smoke"
out_dir = "runs"

[model]
vocab_size = 50257
hidden_size = 256
intermediate_size = 768
n_layers = 2
n_heads = 4
n_kv_heads = 1
seq_len = 64
theta = 1000000.0
eps = 0.000001
tied = false

[train]
seed = 0
batch_size = 2
seq_len = 64
steps = 102
lr = 0.001
decay = 0.1
log_every = 1
eval_every = 20
eval_steps = 10
checkpoint_every = 100
keep_last = 3

[data]
source = "text"
path = "data/tiny_shakespeare/input.txt"
tokenizer = "gpt2"
val_fraction = 0.1

[sampling]
enabled = true
prompt = "ROMEO:"
max_new_tokens = 128
temperature = 0.8
top_k = 50

[wandb]
enabled = true
project = "data-research"
entity = ""
tags = []
