[run]
id = "pleias_synth_smoke"
seed = 123
output_dir = "runs"

[model]
name = "decoder"
variant = "spark-smoke"
vocab_size = 50257
hidden_size = 256
intermediate_size = 768
num_layers = 4
num_heads = 4
n_kv_heads = 1
max_seq_len = 512
rope_theta = 1000000.0
norm_epsilon = 0.000001
tied_embeddings = false
param_dtype = "float32"
compute_dtype = "bfloat16"
remat = "block"

[optimizer]
name = "adamw"
weight_decay = 0.1
grad_clip_norm = 1.0

[optimizer.schedule]
name = "cosine"
peak_lr = 0.0006
warmup_steps = 2
total_steps = 16
min_lr_ratio = 0.1

[data]
train_manifest = "data/pleias_synth_smoke_gpt2/manifest.json"
tokenizer_id = "gpt2"
order = "document_buffer"
shuffle_seed = 123
worker_count = 0
worker_buffer_size = 1
prefetch = false
document_buffer_size = 128
document_refill_size = 128

[training]
seq_len = 512
global_batch_size = 4
gradient_accumulation_steps = 2
target_tokens = 65536
precision = "bf16"
log_every_steps = 1
checkpoint_every_steps = 8

[mesh]
axis_names = ["data"]
axis_sizes = [1]

[[evals]]
name = "validation"
every_steps = 4
num_batches = 2

[artifacts]
wandb_enabled = false
