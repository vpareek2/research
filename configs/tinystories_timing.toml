[experiment]
name = "tinystories_nsys_53m"
out_dir = "runs"

[model]
vocab_size = 50257
hidden_size = 384
intermediate_size = 1536
n_layers = 6
n_heads = 6
n_kv_heads = 6
seq_len = 256
theta = 1000000.0
eps = 0.000001
tied = false

[precision]
compute_dtype = "bf16"
param_dtype = "fp32"
loss_dtype = "fp32"

[distributed]
enabled = true
device_count = "auto"
axis_name = "data"

[profiling]
enabled = true
profiler = "nsys"
start_step = 20
steps = 5
output_dir = "profiles"

[train]
seed = 0
batch_size = 32
seq_len = 256
steps = 40
lr = 0.0006
decay = 0.1
log_every = 1
eval_every = 1000
eval_steps = 10
checkpoint_every = 0
keep_last = 3

[train.lr_schedule]
type = "wsd"
warmup_ratio = 0.01
stable_ratio = 0.80
min_lr_ratio = 0.1

[data]
source = "tokens"
path = "data/tinystories_gpt2"
tokenizer = "gpt2"

[sampling]
enabled = false
prompt = "Once upon a time"
max_new_tokens = 64
temperature = 0.8
top_k = 50

[wandb]
enabled = false
project = "data-research"
entity = ""
tags = ["tinystories", "nsys", "53m"]
