name: Registry required

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  registry-required:
    name: Registry required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate scored run registry update
        run: PYTHONPATH=src python3 -m research.utils.registry_required --base-revision "${{ github.event.pull_request.base.sha }}" --head-revision "${{ github.sha }}"
